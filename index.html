<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مهامي">
<title>مهامي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700&display=swap">
<style>
:root{
  --bg:#FFF1F6;--card:#FFFFFF;--ink:#5A2D49;--soft:#B58AA5;--line:#FADCE8;
  --pk1:#FFC9DD;--pk2:#FFE3EE;--c1:#FFD6E5;--c2:#FFE1D6;--c3:#F3D6F7;--c4:#FFF0C9;--accent:#E8629A;--cat:#FFF6EE;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#2A1A28;--card:#3A2437;--ink:#FFE8F2;--soft:#C79DB5;--line:#52334C;
  --pk1:#6E3B58;--pk2:#4A2D43;--c1:#6E3B58;--c2:#6B4545;--c3:#5A3F6B;--c4:#6B5F34;--accent:#FF8DBB;--cat:#FFF0E6;}}
:root[data-theme="dark"]{
  --bg:#2A1A28;--card:#3A2437;--ink:#FFE8F2;--soft:#C79DB5;--line:#52334C;
  --pk1:#6E3B58;--pk2:#4A2D43;--c1:#6E3B58;--c2:#6B4545;--c3:#5A3F6B;--c4:#6B5F34;--accent:#FF8DBB;--cat:#FFF0E6;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo Bhaijaan 2","Geeza Pro","Segoe UI",system-ui,sans-serif;font-weight:500;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:20px 18px 130px}
h1{margin:6px 0 2px;font-size:30px;font-weight:700}
.date{color:var(--soft);font-size:15px;margin:0 0 16px}
.hero{background:var(--pk1);border-radius:32px;padding:18px;display:flex;align-items:center;gap:14px}
.pet{width:104px;height:104px;flex:none;border-radius:50%;background:var(--card);display:grid;place-items:center;position:relative}
.pet{background:radial-gradient(circle at 35% 28%,var(--card),var(--pk2));box-shadow:inset 0 -6px 12px rgba(232,98,154,.15),0 6px 14px rgba(232,98,154,.2)}
.pet svg{width:98px;height:98px;filter:drop-shadow(0 4px 4px rgba(120,50,85,.18));transform-origin:50% 92%;animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.035)}}
@media (prefers-reduced-motion:reduce){.pet svg{animation:none}}
.pet.hop{animation:hop .6s}
@keyframes hop{30%{transform:translateY(-14px) rotate(-5deg)}60%{transform:translateY(0)}80%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.pet.hop{animation:none}}
.hero b{font-size:19px;display:block;line-height:1.3}
.hero small{opacity:.75;font-size:14px}
.bar{height:12px;background:var(--card);border-radius:99px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .4s}
.pomo{background:var(--card);border:2px solid var(--line);border-radius:28px;margin-top:14px;padding:14px 16px;display:flex;align-items:center;gap:14px}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:104px;height:104px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bg{stroke:var(--pk2)}
.ring .fg{stroke:var(--accent);stroke-dasharray:276.5;stroke-dashoffset:0;transition:stroke-dashoffset .5s linear}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:700;letter-spacing:.5px;direction:ltr}
.pctl{flex:1}
.modes{display:flex;gap:6px;margin-bottom:10px}
.modes button{flex:1;border:0;border-radius:99px;padding:6px 0;font:inherit;font-size:14px;background:var(--pk2);color:var(--soft)}
.modes button.on{background:var(--pk1);color:var(--ink)}
.btns{display:flex;gap:8px}
.go{flex:1;border:0;background:var(--accent);color:#fff;font:inherit;font-size:17px;font-weight:700;padding:9px;border-radius:99px}
.rs{border:0;background:var(--pk2);color:var(--ink);font:inherit;font-size:18px;width:44px;border-radius:99px}
.sess{font-size:13px;color:var(--soft);margin-top:8px}
.tabs{display:flex;gap:8px;margin:20px 0 12px}
.tabs button{flex:1;border-radius:99px;padding:9px 0;font:inherit;font-size:15px;background:var(--card);color:var(--soft);border:2px solid var(--line)}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px;padding:12px 14px;border:2px solid var(--line)}
li .ck{width:30px;height:30px;flex:none;border-radius:50%;border:3px solid var(--accent);background:transparent;display:grid;place-items:center;font-size:16px;color:#fff;padding:0}
li.done .ck{background:var(--accent)}
li .tx{flex:1;font-size:17px;line-height:1.35;word-break:break-word}
li.done .tx{text-decoration:line-through;color:var(--soft)}
li .tag{font-size:20px;width:38px;height:38px;border-radius:14px;display:grid;place-items:center;flex:none}
li .del{border:0;background:none;color:var(--soft);font-size:18px;padding:6px}
.empty{text-align:center;color:var(--soft);padding:30px 10px;font-size:17px}
.empty span{font-size:44px;display:block;margin-bottom:6px}
.fab{position:fixed;inset-inline-start:50%;transform:translateX(50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));border:0;background:var(--accent);color:#fff;font:inherit;font-size:18px;font-weight:700;padding:14px 28px;border-radius:99px;box-shadow:0 8px 24px rgba(232,98,154,.4)}
.fab:active{transform:translateX(50%) scale(.96)}
.sheet{position:fixed;inset:0;background:rgba(70,20,50,.4);display:none;align-items:flex-end;z-index:5}
.sheet.open{display:flex}
.panel{width:100%;max-width:480px;margin:0 auto;background:var(--card);border-radius:32px 32px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.panel h2{margin:0 0 12px;font-size:20px}
.panel input{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:12px 14px;outline:none}
.panel input:focus{border-color:var(--accent)}
.cats{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.cats button{border:2px solid transparent;border-radius:99px;padding:7px 14px;font:inherit;font-size:15px;color:var(--ink)}
.cats button.on{border-color:var(--ink)}
.save{width:100%;border:0;background:var(--accent);color:#fff;font:inherit;font-size:18px;font-weight:700;padding:13px;border-radius:99px}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));inset-inline:16px;max-width:440px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:20px;padding:12px 16px;text-align:center;font-size:16px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <h1>مهامي 🎀</h1>
  <p class="date" id="date"></p>
  <div class="hero">
    <div class="pet" id="pet"></div>
    <div style="flex:1"><b id="msg"></b><small id="cnt"></small><div class="bar"><i id="fill"></i></div></div>
  </div>
  <div class="pomo">
    <div class="ring">
      <svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" id="arc" cx="50" cy="50" r="44"/></svg>
      <span id="time">25:00</span>
    </div>
    <div class="pctl">
      <div class="modes" id="modes"><button data-m="focus" class="on">تركيز ٢٥</button><button data-m="break">استراحة ٥</button></div>
      <div class="btns"><button class="go" id="go">ابدئي</button><button class="rs" id="rs" aria-label="إعادة">↺</button></div>
      <div class="sess" id="sess"></div>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button data-f="todo" class="on">متبقية</button>
    <button data-f="done">منجزة</button>
    <button data-f="all">الكل</button>
  </div>
  <ul id="list"></ul>
</div>
<button class="fab" id="open">＋ مهمة جديدة</button>
<div class="sheet" id="sheet">
  <div class="panel">
    <h2>ماذا ستنجزين اليوم؟</h2>
    <input id="inp" placeholder="اكتبي المهمة…" maxlength="80" autocomplete="off">
    <div class="cats" id="cats"></div>
    <button class="save" id="save">حفظ المهمة</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const CATS=[{e:"🕌",n:"ديني",c:"--c3"},{e:"📚",n:"عمل / دراسة",c:"--c4"},{e:"🌸",n:"شخصي",c:"--c1"},{e:"🏡",n:"بيت",c:"--c2"}];
const $=id=>document.getElementById(id);
let tasks=[],filter="todo",cat=2;
try{tasks=JSON.parse(localStorage.getItem("cute-tasks")||"[]")}catch(e){}
try{if(!localStorage.getItem("cute-cats2")){const mp=[2,1,1,3];tasks.forEach(t=>{t.cat=mp[t.cat]??2});localStorage.setItem("cute-cats2","1");save()}}catch(e){}
function save(){try{localStorage.setItem("cute-tasks",JSON.stringify(tasks))}catch(e){}}
$("date").textContent=new Date().toLocaleDateString("ar",{weekday:"long",day:"numeric",month:"long"});

/* ---------- القطة ---------- */
function cat_svg(m){
  const ink="#8A4A66";
  const eye=(x,y,r)=>`<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*1.18}" fill="url(#ey)"/><circle cx="${x-r*.35}" cy="${y-r*.45}" r="${r*.4}" fill="#fff"/><circle cx="${x+r*.4}" cy="${y+r*.45}" r="${r*.18}" fill="#fff" opacity=".8"/>`;
  const arc=(x)=>`<path d="M${x-7} 56q7-11 14 0" stroke="${ink}" stroke-width="3.4" fill="none" stroke-linecap="round"/>`;
  const eyes=[
    eye(35,57,4.6)+eye(65,57,4.6)+`<path d="M28 48l11 3M72 48l-11 3" stroke="${ink}" stroke-width="2.6" stroke-linecap="round"/><path d="M35 64q-2.5 6 0 9" stroke="#8ED1F5" stroke-width="3.2" fill="none" stroke-linecap="round"/>`,
    eye(35,56,5)+eye(65,56,5),
    eye(35,55,6)+eye(65,55,6),
    arc(35)+arc(65)];
  const mouth=[
    `<path d="M43 76q7-6 14 0" stroke="${ink}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`,
    `<path d="M44 73h12" stroke="${ink}" stroke-width="2.6" stroke-linecap="round"/>`,
    `<path d="M42 71q4 7 8 0q4 7 8 0" stroke="${ink}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`,
    `<path d="M42 70q8 14 16 0z" fill="#D9578A" stroke="${ink}" stroke-width="2.4" stroke-linejoin="round"/><path d="M46 76q4-3 8 0q-4 3-8 0z" fill="#FF9DBF"/>`];
  const extra=m===3?'<text x="4" y="24" font-size="15">💖</text><text x="78" y="18" font-size="13">✨</text>':m===2?'<text x="78" y="22" font-size="13">💗</text>':'';
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><defs>
  <radialGradient id="hg" cx=".35" cy=".25" r=".9"><stop offset="0" stop-color="#fff"/><stop offset=".45" style="stop-color:var(--cat)"/><stop offset="1" stop-color="#F0C8BE"/></radialGradient>
  <radialGradient id="bg2" cx=".4" cy=".2" r=".9"><stop offset="0" style="stop-color:var(--cat)"/><stop offset="1" stop-color="#EDBFB5"/></radialGradient>
  <linearGradient id="ei" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC9DE"/><stop offset="1" stop-color="#FF9FC3"/></linearGradient>
  <radialGradient id="ey" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#8A5470"/><stop offset="1" stop-color="#3E1F33"/></radialGradient>
  <radialGradient id="bl"><stop offset="0" stop-color="#FF8FB8" stop-opacity=".85"/><stop offset="1" stop-color="#FF8FB8" stop-opacity="0"/></radialGradient>
  <radialGradient id="gl"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <filter id="sf"><feGaussianBlur stdDeviation="1.6"/></filter></defs>
  <ellipse cx="50" cy="96" rx="30" ry="3.2" fill="#8A4A66" opacity=".2" filter="url(#sf)"/>
  <g transform="translate(0 -4)">
  <ellipse cx="50" cy="90" rx="25" ry="13" fill="url(#bg2)" stroke="#D9A5A0" stroke-width="1.2"/>
  <path d="M16 50Q8 14 23 11Q39 15 48 31Z" fill="url(#hg)" stroke="#D9A5A0" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M84 50Q92 14 77 11Q61 15 52 31Z" fill="url(#hg)" stroke="#D9A5A0" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M22 41Q19 23 25 20Q33 23 39 32Z" fill="url(#ei)"/><path d="M78 41Q81 23 75 20Q67 23 61 32Z" fill="url(#ei)"/>
  <ellipse cx="50" cy="60" rx="40" ry="32" fill="url(#hg)" stroke="#D9A5A0" stroke-width="1.2"/>
  <ellipse cx="36" cy="38" rx="17" ry="8" fill="url(#gl)" transform="rotate(-22 36 38)"/>
  <ellipse cx="24" cy="68" rx="10" ry="7" fill="url(#bl)"/><ellipse cx="76" cy="68" rx="10" ry="7" fill="url(#bl)"/>
  ${eyes[m]}
  <path d="M46.5 63Q50 60.5 53.5 63Q52 67.5 50 68.5Q48 67.5 46.5 63Z" fill="#FF7FAE"/><ellipse cx="49" cy="63" rx="1.6" ry=".9" fill="#fff" opacity=".7"/>
  ${mouth[m]}
  <path d="M12 62l12 2M13 71l11-3M88 62l-12 2M87 71l-11-3" stroke="#C58AA5" stroke-width="1.5" stroke-linecap="round" opacity=".75"/>
  <ellipse cx="37" cy="92" rx="8.5" ry="6" fill="url(#hg)" stroke="#D9A5A0" stroke-width="1.2"/><ellipse cx="63" cy="92" rx="8.5" ry="6" fill="url(#hg)" stroke="#D9A5A0" stroke-width="1.2"/>
  </g>${extra}</svg>`;
}
const MSG=[["ميمي جائعة للإنجاز 😿","أنجزي مهمة وستبتسم"],["ميمي تنتظرك","لا تزال هناك مهام جميلة"],["ميمي سعيدة 💗","أنتِ في منتصف الطريق!"],["ميمي أسعد قطة في العالم!","أنهيتِ كل مهامك، فخورة بكِ"]];
let lastMood=-1;
function pet(m,hop){
  $("pet").innerHTML=cat_svg(m);
  if(hop){const p=$("pet");p.classList.remove("hop");void p.offsetWidth;p.classList.add("hop")}
}
function render(){
  const done=tasks.filter(t=>t.done).length,total=tasks.length,p=total?done/total:0;
  $("fill").style.width=(p*100)+"%";
  const m=!total?1:p===0?0:p<.5?1:p<1?2:3;
  $("msg").textContent=!total?"ميمي بانتظار مهمتك الأولى":MSG[m][0];
  $("cnt").textContent=!total?"أضيفي مهمة لتبدأ الرحلة":`${MSG[m][1]} (${done}/${total})`;
  if(m!==lastMood){pet(m,lastMood>=0&&m>lastMood);lastMood=m}
  const items=tasks.filter(t=>filter==="all"||(filter==="done")===t.done);
  const ul=$("list");ul.innerHTML="";
  if(!items.length){ul.innerHTML=`<div class="empty"><span>${filter==="done"?"🍓":"✨"}</span>${filter==="done"?"لا توجد مهام منجزة بعد":"لا توجد مهام هنا"}</div>`;return}
  items.forEach(t=>{
    const c=CATS[t.cat]||CATS[0],li=document.createElement("li");li.className=t.done?"done":"";
    const ck=document.createElement("button");ck.className="ck";ck.setAttribute("aria-label","إنجاز");ck.textContent=t.done?"✓":"";
    ck.onclick=()=>{t.done=!t.done;save();render();if(t.done)pet(lastMood,true)};
    const tx=document.createElement("div");tx.className="tx";tx.textContent=t.text;
    const tag=document.createElement("div");tag.className="tag";tag.style.background=`var(${c.c})`;tag.textContent=c.e;
    const del=document.createElement("button");del.className="del";del.setAttribute("aria-label","حذف");del.textContent="✕";
    del.onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id);save();render()};
    li.append(ck,tx,tag,del);ul.append(li);
  });
}
$("tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;filter=b.dataset.f;[...$("tabs").children].forEach(x=>x.classList.toggle("on",x===b));render()};
function drawCats(){$("cats").innerHTML="";CATS.forEach((c,i)=>{const b=document.createElement("button");b.textContent=`${c.e} ${c.n}`;b.style.background=`var(${c.c})`;b.className=i===cat?"on":"";b.onclick=()=>{cat=i;drawCats()};$("cats").append(b)})}
$("open").onclick=()=>{$("sheet").classList.add("open");drawCats();setTimeout(()=>$("inp").focus(),50)};
$("sheet").onclick=e=>{if(e.target===$("sheet"))$("sheet").classList.remove("open")};
function add(){
  const v=$("inp").value.trim();if(!v)return;
  tasks.unshift({id:Date.now(),text:v,cat,done:false});save();
  $("inp").value="";$("sheet").classList.remove("open");filter="todo";
  [...$("tabs").children].forEach(x=>x.classList.toggle("on",x.dataset.f==="todo"));render();
}
$("save").onclick=add;
$("inp").addEventListener("keydown",e=>{if(e.key==="Enter")add()});

/* ---------- بومودورو ---------- */
const DUR={focus:1500,break:300};
let mode="focus",left=DUR.focus,end=0,running=false,timer=null;
const today=()=>new Date().toISOString().slice(0,10);
let pomo={d:today(),n:0};
try{const s=JSON.parse(localStorage.getItem("cute-pomo")||"null");if(s&&s.d===today())pomo=s}catch(e){}
function drawT(){
  const m=String(Math.floor(left/60)).padStart(2,"0"),s=String(left%60).padStart(2,"0");
  $("time").textContent=`${m}:${s}`;
  $("arc").style.strokeDashoffset=276.5*(1-left/DUR[mode]);
  $("go").textContent=running?"إيقاف مؤقت":"ابدئي";
  $("sess").textContent=pomo.n?`جلسات اليوم: ${"🍓".repeat(Math.min(pomo.n,8))} ${pomo.n}`:"لا جلسات اليوم بعد";
  document.title=running?`${m}:${s} · مهامي`:"مهامي";
}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),3500)}
function setMode(m){mode=m;left=DUR[m];running=false;clearInterval(timer);[...$("modes").children].forEach(b=>b.classList.toggle("on",b.dataset.m===m));drawT()}
function tick(){
  left=Math.max(0,Math.ceil((end-Date.now())/1000));
  if(left===0){
    clearInterval(timer);running=false;
    try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
    if(mode==="focus"){pomo.n++;try{localStorage.setItem("cute-pomo",JSON.stringify(pomo))}catch(e){}toast("أحسنتِ! ميمي تحتفل معكِ 🐟 خذي استراحة");pet(lastMood,true);setMode("break")}
    else{toast("انتهت الاستراحة، هيا نركّز 🎀");setMode("focus")}
    return;
  }
  drawT();
}
$("go").onclick=()=>{
  if(running){running=false;clearInterval(timer);drawT();return}
  running=true;end=Date.now()+left*1000;timer=setInterval(tick,500);drawT();
};
$("rs").onclick=()=>setMode(mode);
$("modes").onclick=e=>{const b=e.target.closest("button");if(b)setMode(b.dataset.m)};
document.addEventListener("visibilitychange",()=>{if(running)tick()});
render();drawT();
</script>
</body>
</html>
